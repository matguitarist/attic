name: Attic
options:
  bundleIdPrefix: com.attic
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  AtticKit:
    path: AtticKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Attic:
    type: application
    platform: macOS
    sources:
      - path: Attic
        excludes:
          - "Attic.entitlements"
          - "Info.plist"
          - "Resources/AppIcon.icon"
      # One file to Xcode (an Icon Composer document), not a folder of
      # loose resources.
      - path: Attic/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.attic.app
        PRODUCT_NAME: Attic
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "32"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        # Attic/Resources/AppIcon.icon, made in the Icon Composer format.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Attic/Attic.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # Merged into the generated one; holds the Sparkle keys.
        INFOPLIST_FILE: Attic/Info.plist
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ENABLE_PREVIEWS: YES
        # Text is extracted into Localizable.xcstrings at build time, so
        # translators only ever edit the catalog.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    dependencies:
      - package: AtticKit
        product: AtticModels
      - package: AtticKit
        product: AtticPersistence
      - package: AtticKit
        product: AtticLibraryScanning
      - package: AtticKit
        product: AtticEmulation
      - package: AtticKit
        product: AtticScraping
      - package: Sparkle
