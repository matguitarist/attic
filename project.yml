name: RomsBox
options:
  bundleIdPrefix: com.romsbox
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  RomsBoxKit:
    path: RomsBoxKit

targets:
  RomsBox:
    type: application
    platform: macOS
    sources:
      - path: RomsBox
        excludes:
          - "RomsBox.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romsbox.app
        PRODUCT_NAME: RomsBox
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: RomsBox/RomsBox.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: RomsBoxKit
        product: RomsBoxModels
      - package: RomsBoxKit
        product: RomsBoxPersistence
      - package: RomsBoxKit
        product: RomsBoxLibraryScanning
      - package: RomsBoxKit
        product: RomsBoxEmulation
      - package: RomsBoxKit
        product: RomsBoxScraping
